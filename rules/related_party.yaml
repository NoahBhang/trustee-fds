# =============================================================================
# 특수관계인 분류 규칙
# =============================================================================
# parties.csv 는 '관계라는 사실'만 기록한다.
# 그 사실이 법령상 특수관계인에 해당하는지는 이 파일이 판단한다.
#
# ★ 이 파일은 반드시 법률 전문가의 검토를 받아야 한다.
#   특수관계인의 범위는 채무자회생법 제392조 제1항 및 그 위임을 받은
#   대통령령(시행령 제4조)에 정해져 있다.
#
# status 사다리:  draft → spec_verified → legal_reviewed → production
#   draft          조문 대조 전 초안
#   spec_verified  시행령 원문과 대조 완료. 아직 법률 전문가 검토 전
#   legal_reviewed 법률 전문가가 호별 분류를 검토·확인
#   production     실사건 투입 승인
#
# 검토자 확인란:
#   [x] 시행령 제4조 원문 대조 완료 (검토일: 2026-09-03 / 검토자: Claude / 출처: 국가법령정보센터)
#       미해결: former_spouse · affiliate · officer 3개 유형은 사실 데이터 부족으로 verify 유지
#       주의:   affinity/collateral_relative 는 촌수 필드 부재로 '범위 내'를 가정함
#   [ ] 법률 전문가 검토 완료 (검토일: ____ / 검토자: ____)
# =============================================================================

rule_id: related-party-classification
version: 0.2.0
status: spec_verified
legal_basis:
  - "채무자회생법 제391조 제4호 — 무상행위의 부인 (지급정지·파산신청 후 또는 그 전 6월 이내)"
  - "채무자회생법 제392조 제1항 — '특수관계인' = 대통령령이 정하는 범위의 특수관계에 있는 자"
  - "채무자회생법 제392조 제3항 — 상대방이 특수관계인이면 제391조 제4호의 '6월'을 '1년'으로"
  - "채무자회생법 시행령 제4조 (특수관계인) — 시행 2024-06-11. 국가법령정보센터 원문 대조"
  - "대법원 2009. 2. 12. 선고 2008다48117 — '상대방'은 법률행위의 상대방"
  - "민법 제768조(혈족), 제769조(인척), 제775조 제1항(인척관계의 종료)"

# -----------------------------------------------------------------------------
# 시행령 제4조 원문 — 검토 편의를 위한 전재
# -----------------------------------------------------------------------------
# 법률 전문가가 코드를 읽지 않고 이 파일만으로 분류를 검토할 수 있어야 한다.
statute_text:
  ref: "채무자 회생 및 파산에 관한 법률 시행령 제4조(특수관계인)"
  source: "국가법령정보센터 (law.go.kr), 조회일 2026-09-03, 시행 2024-06-11"
  text: |
    법 제101조제1항, 법 제218조제2항 각 호 및 법 제392조제1항에서 "대통령령이
    정하는 범위의 특수관계에 있는 자"라 함은 다음 각 호의 어느 하나에 해당하는
    자를 말한다.

    1. 본인이 개인인 경우에는 다음 각 목의 어느 하나에 해당하는 자
       가. 배우자(사실상의 혼인관계에 있는 자를 포함한다. 이하 같다)
       나. 8촌 이내의 혈족이거나 4촌 이내의 인척
       다. 본인의 금전 그 밖의 재산에 의하여 생계를 유지하는 자이거나 본인과
           생계를 함께 하는 자
       라. 본인이 단독으로 또는 그와 가목 내지 다목의 관계에 있는 자와 합하여
           100분의 30 이상을 출자하거나 임원의 임면 등의 방법으로 법인 그 밖의
           단체의 주요 경영사항에 대하여 사실상 영향력을 행사하고 있는 경우에는
           당해 법인 그 밖의 단체와 그 임원
       마. (라목과 같은 요건. 합산 대상 범위가 '가목 내지 라목'으로 넓어진 것)
           당해 법인 그 밖의 단체와 그 임원

    2. 본인이 법인 그 밖의 단체인 경우에는 다음 각 목의 어느 하나에 해당하는 자
       가. 임원
       나. 계열회사(「독점규제 및 공정거래에 관한 법률」 제2조제3호에 따른
           계열회사를 말한다) 및 그 임원
       다. 단독으로 또는 제1호 각 목의 관계에 있는 자와 합하여 본인에게 100분의
           30 이상을 출자하거나 임원의 임면 등의 방법으로 본인의 주요 경영사항에
           대하여 사실상 영향력을 행사하고 있는 개인 및 그와 제1호 각 목의 관계에
           있는 자와 법인 그 밖의 단체(계열회사 제외) 및 그 임원
       라. 본인이 단독으로 또는 그와 가목 내지 다목의 관계에 있는 자와 합하여
           100분의 30 이상을 출자하거나 임원의 임면 등의 방법으로 단체의 주요
           경영사항에 대하여 사실상 영향력을 행사하고 있는 경우에는 당해 법인
           그 밖의 단체 및 그 임원
  caveat: >
    이 전재는 온라인 조회 결과이며 요약 과정을 거쳤다. 촌수(8촌/4촌)·30% 임계·
    계열회사 정의(공정거래법 제2조제3호)는 복수 경로에서 일치 확인했다.
    제1항 라목·마목의 미세한 문언 차이는 종이 법령집과 최종 대조가 필요하다.

# -----------------------------------------------------------------------------
# 관계 유형 → 특수관계인 해당 여부
# -----------------------------------------------------------------------------
# verdict:
#   related      특수관계인으로 취급 → 소급기간 12월
#   not_related  일반 상대방 → 소급기간 6월
#   verify       판단 보류 → 넓은 창(12월) 적용 + 검토 플래그
classification:
  self:
    verdict: not_related
    note: "채무자 본인. 법률행위의 상대방이 아니다"

  # --- 본인이 개인인 경우: 시행령 제4조 제1항 제1호 각 목 ---
  spouse:
    verdict: related
    note: "제1항 제1호 가목 — 배우자. 사실상의 혼인관계에 있는 자를 포함한다"
  lineal_ascendant:
    verdict: related
    note: "제1항 제1호 나목 — '8촌 이내의 혈족'. 직계존속은 직계혈족(민법 제768조)"
  lineal_descendant:
    verdict: related
    note: "제1항 제1호 나목 — '8촌 이내의 혈족'. 직계비속은 직계혈족(민법 제768조)"
  sibling:
    verdict: related
    note: "제1항 제1호 나목 — '8촌 이내의 혈족'. 형제자매는 2촌 방계혈족"
  affinity:
    verdict: related
    note: >
      제1항 제1호 나목 — '4촌 이내의 인척'. 처가·시가 및 배우자의 혈족 등
      통상 기록되는 인척은 4촌 이내다(민법 제769조·제777조).
      [한계] parties.csv 에 촌수 필드가 없어 '4촌 이내'를 가정한다. 5촌 이상
      인척은 특수관계인이 아니므로, 촌수를 relation_basis 에 적는 것이 바람직하다.
      인척관계는 혼인의 취소·이혼으로 종료되며(민법 제775조 제1항), 시점 판정은
      아래 temporal_scope 가 relation_valid_to 로 처리한다.
  collateral_relative:
    verdict: related
    note: >
      제1항 제1호 나목 — '8촌 이내의 혈족'. 혈족은 직계·방계를 포함한다(민법 제768조).
      조카(3촌)·사촌(4촌)·5촌·6촌 등 통상 기록되는 방계혈족은 8촌 이내다.
      [한계] 촌수 필드 부재로 '8촌 이내'를 가정한다. 9촌 이상 방계혈족은 비해당.
  employee:
    verdict: not_related
    note: >
      시행령 제4조는 '직원'을 특수관계인으로 열거하지 않는다. 근로의 대가로 급여를
      받는 것은 다목의 '본인의 금전 그 밖의 재산에 의하여 생계를 유지하는 자'로
      보지 않는다.
      [예외] 급여 외에 본인의 재산에 생계를 의존하는 사정이 인정되면 다목에
      해당할 수 있으나 드물다. 그런 경우엔 relation_type 을 별도로 코딩한다.

  # --- 채무자가 개인이냐 법인이냐에 따라 갈리는 유형 → verify ---
  former_spouse:
    verdict: verify
    note: >
      시행령 제4조 어느 목에도 '전 배우자'는 열거되어 있지 않다.
      행위 당시 혼인관계(사실혼 포함)가 존속했다면 가목의 배우자이므로 relation_type
      을 spouse 로 코딩해야 한다. 이혼 후 시점의 거래라면 배우자가 아니고, 인척관계도
      이혼으로 종료되므로(민법 제775조 제1항) 원칙적으로 특수관계인이 아니다.
      [불확실] ① 위장이혼 — 판례는 실질을 본다. ② 이혼 후에도 본인의 금전·재산으로
      생계를 유지하면 다목에 해당할 수 있다. ③ 동일인 여부 등 사실관계(샘플 P-007).
      순수한 시점 문제는 temporal_scope 의 relation_valid_to 로 판정된다.
  affiliate:
    verdict: verify
    note: >
      채무자가 법인인 경우: 제2항 나목 — '계열회사(공정거래법 제2조제3호) 및 그
      임원' → 특수관계인.
      채무자가 개인인 경우: 제1항 제1호 라목·마목 — 본인이 단독 또는 가~다목
      관계자와 합하여 100분의 30 이상을 출자하거나 임원의 임면 등으로 사실상
      영향력을 행사하는 법인만 해당.
      [불확실] parties.csv 에 지분율이 구조화되어 있지 않고(자유서술 relation_basis),
      관계 판정 단계에서 cases.debtor_type 을 참조하지 않는다. 30% 요건과 채무자
      유형을 사람이 대조해야 한다. 샘플 CORP-AFF 는 '지분 62% 보유'(> 30%)이고
      채무자가 법인이라 두 경로 모두에서 특수관계인이나, 룰은 자동 확정하지 않는다.
  officer:
    verdict: verify
    note: >
      채무자가 법인인 경우: 제2항 가목 — '임원' → 특수관계인.
      채무자가 개인인 경우: 라목·마목의 '그 임원'에 한정 — 본인이 30% 이상
      출자하거나 사실상 영향력을 행사하는 법인의 임원만 해당하고, 무관한 법인의
      임원은 비해당.
      [불확실] 어느 법인의 임원인지, 그 법인과 채무자의 지분·지배 관계.

  none:
    verdict: not_related

unknown_relation_type: verify
verify_behavior:
  lookback: widest        # 판단 보류 시 넓은 창으로 잡아 누락을 막는다
  flag: relation_unverified

# -----------------------------------------------------------------------------
# 시점 의존성
# -----------------------------------------------------------------------------
# 관계는 변한다. 이혼, 퇴임, 지분 매각, 입양.
# 판단 기준일은 '행위 당시'이지 '파산선고 당시'가 아니다.
temporal_scope:
  evaluate_at: transaction.transaction_date
  validity_fields:
    from: party.relation_valid_from
    to:   party.relation_valid_to
  rules:
    - if: "relation_valid_from is null and relation_valid_to is null"
      then: "기간 정보 없음 → 상시 유효로 간주하되 relation_period_unknown 플래그"
    - if: "transaction_date < relation_valid_from"
      then: not_related
    - if: "relation_valid_to is not null and transaction_date > relation_valid_to"
      then: not_related
  note: >
    관계 종료일 전후 30일 이내의 거래는 relation_boundary 플래그를 붙인다.
    이혼 재산분할처럼 관계 종료 자체가 거래의 원인인 경우가 있기 때문이다.

# -----------------------------------------------------------------------------
# 역할별 적용 (가장 중요)
# -----------------------------------------------------------------------------
# 소급기간 분기는 오직 legal_counterparty 의 관계만 본다.
# principal_debtor 나 ultimate_beneficiary 의 관계는 조사 신호일 뿐,
# 절대 소급기간을 바꾸지 않는다. (2008다48117)
role_application:
  determines_lookback:
    - legal_counterparty
  signal_only:
    - principal_debtor
    - ultimate_beneficiary
  forbidden: >
    principal_debtor 또는 ultimate_beneficiary 의 특수관계 여부를 근거로
    12월 소급기간을 적용하는 것. 대법원 2008다48117 위반.

# 상대방이 복수인 경우
multiple_counterparties:
  lookback_resolution: any_related_wins   # 한 명이라도 특수관계인이면 12월
  value_allocation: by_share_ratio        # 출연 가치는 지분 비율로 배분
  note: "지분 비율의 합이 1.0이 아니면 share_sum_mismatch 플래그"
